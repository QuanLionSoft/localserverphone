name: PocketPaaS Verification & Unit Tests

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  schema-and-policy-checks:
    name: SQLite Schema v4 & Policy Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Room v4 SQLite migration chain
        run: python3 verification/database/test_schema_v4.py
      - name: Verify SSH and Service policy invariants
        run: python3 verification/database/test_policies.py
      - name: Verify Backup HMAC, CSV formula guard and Remote API contracts
        run: python3 verification/database/test_backup_and_logs.py

  room-jvm-and-unit-tests:
    name: Room JVM & Ktor Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Room JVM KSP & Unit Tests
        working-directory: verification/room-jvm
        run: gradle test --info
